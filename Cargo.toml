[workspace]
members = ["jsonrpc_core", "jsonrpc_cli", "jsonrpc_ws_client", "jsonrpc_http_client", "jsonrpc_client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytes = "1.12.0"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
thiserror = "2.0.18"
anyhow = "1.0.103"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hotpath = "0.21"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
smallvec = { version = "1.15.2", features = ["serde", "write"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
